# git-cliff configuration — CHANGELOG.md is generated by CI (release.yml), do
# not edit by hand. Conventional Commits on main drive both semver (via
# bitshifted/git-auto-semver) and the grouping below.
# https://git-cliff.org/docs/configuration

[changelog]
header = """
# Changelog

All notable changes to this project are documented here. This file is
generated automatically by CI from Conventional Commits landing on `main`
([Keep a Changelog](https://keepachangelog.com/en/1.1.0/),
[Semantic Versioning](https://semver.org/spec/v2.0.0.html)).\n
"""
body = """
{% if version %}\
## [{{ version | trim_start_matches(pat="v") }}] - {{ timestamp | date(format="%Y-%m-%d") }}
{% else %}\
## [unreleased]
{% endif %}\
{% for group, commits in commits | group_by(attribute="group") %}
### {{ group | striptags | trim }}
{% for commit in commits %}\
- {% if commit.scope %}**{{ commit.scope }}:** {% endif %}{{ commit.message | upper_first }} ({{ commit.id | truncate(length=7, end="") }})
{% endfor %}\
{% endfor %}\n
"""
trim = true

[git]
conventional_commits = true
filter_unconventional = true
commit_parsers = [
  { breaking = true, group = "<!-- 0 -->BREAKING CHANGES" },
  { message = "^feat", group = "<!-- 1 -->Features" },
  { message = "^fix", group = "<!-- 2 -->Bug Fixes" },
  { message = "^perf", group = "<!-- 3 -->Performance" },
  { message = "^refactor", group = "<!-- 4 -->Refactoring" },
  { message = "^revert", group = "<!-- 5 -->Reverted" },
  { message = "^docs", skip = true },
  { message = "^(chore|ci|test|style|build)", skip = true },
  { message = ".*", group = "<!-- 9 -->Other" },
]
tag_pattern = "v[0-9].*"
sort_commits = "oldest"
