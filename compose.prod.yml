# ── Yasha production stack (self-hosters: no source checkout needed) ─────────
# Pulls the pre-built image from the registry — you only need this file + a .env:
#
#   mkdir yasha && cd yasha
#   curl -fLo compose.prod.yml https://raw.githubusercontent.com/storm1er/yasha/HEAD/compose.prod.yml
#   curl -fLo .env.example      https://raw.githubusercontent.com/storm1er/yasha/HEAD/.env.example
#   cp .env.example .env        # edit: BETTER_AUTH_SECRET, BETTER_AUTH_URL,
#                               # BETTER_AUTH_TRUSTED_ORIGINS, BOOTSTRAP_ADMIN_*, YASHA_IMAGE
#   docker compose -f compose.prod.yml up -d
#
# Then open http://<host>:${PORT:-3000} behind your own TLS proxy, or add the
# bundled Caddy (automatic Let's Encrypt on 80/443, see compose.prod.caddy.yml).
#
# All state lives in the `yasha_data` volume (SQLite DB — attachments included —,
# import spool, APK build artifacts). Back that one volume up; that's it.
# To use an external Lemonade instead of the bundled one: set LEMONADE_BASE_URL
# in .env and add `deploy: {replicas: 0}` under lemonade via a compose.override.yml.

name: yasha

services:
  web:
    # Image published by CI; set in .env (e.g. ghcr.io/storm1er/yasha:1.0.0).
    image: ${YASHA_IMAGE:-ghcr.io/storm1er/yasha:latest}
    ports:
      # Loopback-only by default: terminate TLS at your own proxy (point it at
      # 127.0.0.1:${PORT:-3000}) or use the bundled Caddy overlay, which reaches
      # web over the internal network and needs no published port at all.
      - "127.0.0.1:${PORT:-3000}:3000"
    env_file: .env
    volumes:
      - yasha_data:/data
    restart: unless-stopped
    # No depends_on: with an external Lemonade the bundled service is scaled to
    # replicas: 0, and web retries backend health on its own.

  # Bundled LLM backend — stays on the internal network (never published).
  # For AMD GPU (ROCm), add devices/groups in a compose.override.yml.
  lemonade:
    image: ghcr.io/lemonade-sdk/lemonade-server:latest
    volumes:
      - lemonade-cache:/opt/lemonade/.cache/huggingface
      - lemonade-llama:/opt/lemonade/llama
      - lemonade-data:/opt/lemonade/.cache/lemonade
      - lemonade-config:/opt/lemonade/.config/lemonade
    restart: unless-stopped

volumes:
  yasha_data:
  lemonade-cache:
  lemonade-llama:
  lemonade-data:
  lemonade-config:
