name: Feature request
description: An idea for the project
title: "[feat]: "
labels: ["enhancement"]
body:
  - type: textarea
    id: problem
    attributes:
      label: Problem / motivation
      description: What need does this address? What does it unblock?
    validations:
      required: true
  - type: textarea
    id: solution
    attributes:
      label: Proposed solution
      description: How should it work? UI sketch, API shape, env/settings keys…
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
  - type: textarea
    id: scope
    attributes:
      label: Scope
      value: |
        - [ ] Web UI (+ en/fr strings)
        - [ ] Server routes/lib (+ tests at 100% coverage)
        - [ ] Android app (+ strings en/fr)
        - [ ] Docs update
