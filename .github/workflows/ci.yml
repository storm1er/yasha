name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      # tests/auth-startup.test.ts exercises the /data/yasha.db fallback exactly
      # as it behaves inside the Docker runtime image; mirror that path here.
      - name: Provide /data (default DB path test)
        run: sudo mkdir -p /data && sudo chown "$USER" /data

      - name: Typecheck
        run: npx tsc --noEmit

      - name: Lint
        run: npm run lint

      - name: Tests + coverage gate
        run: npx vitest run --coverage
        env:
          BETTER_AUTH_SECRET: ci-onl…cdef

      - name: Build
        run: npm run build
        env:
          NEXT_TELEMETRY_DISABLED: "1"
          BETTER_AUTH_SECRET: ci-onl…cdef
          BETTER_AUTH_URL: http://localhost
          LEMONADE_BASE_URL: http://localhost:13305

  docker:
    # Smoke-build the production image (no push) so the runtime path stays green.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/build-push-action@v6
        with:
          file: docker/Dockerfile
          target: runtime
          push: false
          cache-from: type=gha
          cache-to: type=gha,mode=max
