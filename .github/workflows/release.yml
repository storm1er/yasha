name: Release

# Conventional Commits on main drive semver: fix/docs/... → patch, feat → minor,
# BREAKING CHANGE → major (bitshifted/git-auto-semver). Each push to main
# computes + creates the next `vX.Y.Z` tag and publishes that image to GHCR.
# A tag pushed manually does NOT trigger this workflow (GitHub blocks
# token-triggered recursion) — merge to main or use the manual dispatch below.

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      manual_bump:
        description: Bump level (auto = derive from the merge commit message)
        type: choice
        options: [auto, patch, minor, major]
        default: auto

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  version:
    runs-on: ubuntu-latest
    permissions:
      contents: write # push the version tag
    outputs:
      version: ${{ steps.semver.outputs.version-string }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          fetch-tags: true

      - name: Compute + create next semver tag
        id: semver
        uses: bitshifted/git-auto-semver@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          main_branch: main
          initial_version: 0.1.0
          create_tag: true
          manual_bump: ${{ inputs.manual_bump != 'auto' && inputs.manual_bump || '' }}

  changelog:
    needs: version
    if: needs.version.outputs.version != ''
    runs-on: ubuntu-latest
    permissions:
      contents: write # commit CHANGELOG.md + create the GitHub release
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          fetch-tags: true

      # Regenerate the full CHANGELOG.md from tagged history + open the GitHub
      # release with the new section as its notes (git-cliff, config: cliff.toml).
      # No --latest here: it would emit only the newest section and the OUTPUT
      # redirect would then wipe every older release from the file.
      # OUTPUT is the action's documented way to redirect git-cliff's stdout.
      - name: Generate changelog
        uses: orhun/git-cliff-action@v4
        env:
          OUTPUT: CHANGELOG.md

      - name: Write notes for the release + commit changelog
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VERSION: ${{ needs.version.outputs.version }}
        run: |
          set -eu
          # Notes = this version's section of the regenerated CHANGELOG.md
          awk -v v="${VERSION}" '
            index($0, "## [" v "]") == 1 { p = 1; print; next }
            p && /^## \[/ { exit }
            p { print }
          ' CHANGELOG.md > "release-notes-v${VERSION}.md"
          # Docs/maintenance-only releases produce no rendered section: keep a
          # non-empty body for the GitHub release.
          if [ ! -s "release-notes-v${VERSION}.md" ]; then
            echo "_No notable changes in this release (documentation/maintenance only)._" \
              > "release-notes-v${VERSION}.md"
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          if git diff --quiet -- CHANGELOG.md; then
            echo "CHANGELOG.md unchanged; skipping commit"
          else
            git add CHANGELOG.md
            git commit -m "docs: changelog for v${VERSION} [skip ci]"
            git push
          fi
          gh release create "v${VERSION}" \
            --title "v${VERSION}" \
            --notes-file "release-notes-v${VERSION}.md"

  publish:
    needs: version
    if: needs.version.outputs.version != ''
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    env:
      REGISTRY: ghcr.io
      IMAGE: ${{ github.repository }}
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build & push production image
        uses: docker/build-push-action@v6
        with:
          file: docker/Dockerfile
          target: runtime
          push: true
          tags: |
            ${{ env.REGISTRY }}/${{ env.IMAGE }}:${{ needs.version.outputs.version }}
            ${{ env.REGISTRY }}/${{ env.IMAGE }}:latest
          labels: org.opencontainers.image.version=${{ needs.version.outputs.version }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
