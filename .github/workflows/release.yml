name: Release

# Conventional Commits on main drive semver: fix/docs/... → patch, feat → minor,
# BREAKING CHANGE → major (bitshifted/git-auto-semver). Each push to main
# computes the next `vX.Y.Z`, then ONE bot commit carries both the regenerated
# CHANGELOG.md and the Android version stamp bump (android/app/build.gradle.kts,
# issue #34 update channel); the tag points at that commit and its image is
# published to GHCR — so merging an Android change is enough to notify devices,
# no manual stamp bumps in feature PRs.
# A tag pushed manually does NOT trigger this workflow (GitHub blocks
# token-triggered recursion) — merge to main or use the manual dispatch below.

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      manual_bump:
        description: Bump level (auto = derive from the merge commit message)
        type: choice
        options: [auto, patch, minor, major]
        default: auto

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  version:
    runs-on: ubuntu-latest
    permissions:
      contents: read # compute only; the tag is created by the release job
    outputs:
      version: ${{ steps.semver.outputs.version-string }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          fetch-tags: true

      # create_tag stays off: the tag must land on the release commit below
      # (stamp + changelog included), not on the merge commit, so the tagged
      # tree is self-consistent — the Docker VERSION stamp, the CHANGELOG
      # section the in-app updater shows, and the gradle file the server
      # builds the generic APK from all carry the SAME version.
      - name: Compute next semver
        id: semver
        uses: bitshifted/git-auto-semver@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          main_branch: main
          initial_version: 0.1.0
          create_tag: false
          manual_bump: ${{ inputs.manual_bump != 'auto' && inputs.manual_bump || '' }}

  release:
    needs: version
    if: needs.version.outputs.version != ''
    runs-on: ubuntu-latest
    permissions:
      contents: write # stamp + CHANGELOG.md commit, version tag, GitHub release
    steps:
      # main is ruleset-protected (PRs only; GitHub Free only enforces this
      # since the repo went public). The GITHUB_TOKEN cannot bypass a repo
      # ruleset, so checkout over SSH authenticates the release pushes below
      # with a write deploy key (repo secret RELEASE_DEPLOY_KEY; the key is
      # also the ruleset's DeployKey bypass actor). checkout leaves SSH set up
      # for the later steps of this job.
      - uses: actions/checkout@v4
        with:
          ssh-key: ${{ secrets.RELEASE_DEPLOY_KEY }}
          fetch-depth: 0
          fetch-tags: true

      # Regenerate the full CHANGELOG.md, labelling the changes since the last
      # tag with the version about to be cut (the tag does not exist yet —
      # git-cliff's -t names the otherwise-unreleased section). No --latest
      # here: it would emit only the newest section and the OUTPUT redirect
      # would then wipe every older release from the file.
      # OUTPUT is the action's documented way to redirect git-cliff's stdout.
      - name: Generate changelog
        uses: orhun/git-cliff-action@v4
        env:
          OUTPUT: CHANGELOG.md
        with:
          args: --tag "v${{ needs.version.outputs.version }}"

      - name: Bump stamp, commit, tag, publish GitHub release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VERSION: ${{ needs.version.outputs.version }}
        run: |
          set -eu
          # Fail fast with a clear message if the deploy-key checkout was
          # skipped (secret missing → origin stays HTTPS, push would 403).
          if ! git remote get-url origin | grep -qE '^(git@github\.com:|ssh://git@github\.com/)'; then
            echo "::error::origin is not SSH — set the repo secret RELEASE_DEPLOY_KEY (private half of the write deploy key whose ruleset bypass lets release commits reach protected main)."
            exit 1
          fi
          # Android update stamp (issue #34): android/app/build.gradle.kts is
          # the SOLE source — the Dockerfile derives the runtime VERSION file
          # from it and the server builds the generic APK from the same tree.
          # versionCode derives from the tag (major·10⁶ + minor·10³ + patch),
          # so it is monotonic with releases; versionName = tag, so the release
          # notes parser always matches this release's [VERSION] section.
          CODE=$(echo "${VERSION}" | awk -F. '{ print $1*1000000 + $2*1000 + $3 }')
          if [ "${CODE}" -gt 2147483647 ]; then
            echo "versionCode overflow (major too large)"; exit 1
          fi
          sed -i -E \
            -e "s/^([[:space:]]*versionCode = )[0-9]+/\1${CODE}/" \
            -e "s/^([[:space:]]*versionName = \")[^\"]+/\1${VERSION}/" \
            android/app/build.gradle.kts
          grep -q "versionCode = ${CODE}" android/app/build.gradle.kts
          grep -q "versionName = \"${VERSION}\"" android/app/build.gradle.kts

          # Notes = this version's section of the regenerated CHANGELOG.md
          awk -v v="${VERSION}" '
            index($0, "## [" v "]") == 1 { p = 1; print; next }
            p && /^## \[/ { exit }
            p { print }
          ' CHANGELOG.md > "release-notes-v${VERSION}.md"
          # Docs/maintenance-only releases produce no rendered section: keep a
          # non-empty body for the GitHub release.
          if [ ! -s "release-notes-v${VERSION}.md" ]; then
            echo "_No notable changes in this release (documentation/maintenance only)._" \
              > "release-notes-v${VERSION}.md"
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add CHANGELOG.md android/app/build.gradle.kts
          # A rerun after a mid-job failure may find everything already bumped.
          git diff --cached --quiet || git commit -m "chore(release): v${VERSION} [skip ci]"
          # main keeps moving under this job (Dependabot PRs auto-merge while
          # the changelog is being generated), so land the stamp commit with
          # rebase-and-retry. The push is ATOMIC: branch + tag both land or
          # neither does — a tag can never dangle off a rejected commit.
          # The tag is (re)pointed at HEAD on every attempt, so it always
          # names exactly the commit that lands on main.
          attempt=0
          while :; do
            attempt=$((attempt + 1))
            git tag -f "v${VERSION}" >/dev/null
            if git push --atomic origin "HEAD:main" "refs/tags/v${VERSION}"; then
              break
            fi
            if [ "${attempt}" -ge 5 ]; then
              echo "::error::could not land v${VERSION} after ${attempt} attempts (main too busy)"
              exit 1
            fi
            sleep "$((attempt * 3))"
            git fetch -q origin main
            git rebase -q origin/main
          done
          gh release create "v${VERSION}" \
            --title "v${VERSION}" \
            --notes-file "release-notes-v${VERSION}.md"

  publish:
    needs: [version, release]
    if: needs.version.outputs.version != ''
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    env:
      REGISTRY: ghcr.io
      IMAGE: ${{ github.repository }}
    steps:
      # Checkout the TAG, not the event ref: the image must be built from the
      # tree that carries this release's stamp + changelog section.
      - uses: actions/checkout@v4
        with:
          ref: v${{ needs.version.outputs.version }}

      - uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build & push production image
        uses: docker/build-push-action@v6
        with:
          file: docker/Dockerfile
          target: runtime
          push: true
          tags: |
            ${{ env.REGISTRY }}/${{ env.IMAGE }}:${{ needs.version.outputs.version }}
            ${{ env.REGISTRY }}/${{ env.IMAGE }}:latest
          labels: org.opencontainers.image.version=${{ needs.version.outputs.version }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
