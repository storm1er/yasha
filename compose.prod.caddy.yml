# ── Optional overlay: bundled Caddy TLS proxy for the production stack ──────
# No Caddyfile on disk needed (config is inlined below). Usage:
#
#   docker compose -f compose.prod.yml -f compose.prod.caddy.yml up -d
#
# In .env set:
#   CADDY_ADDRESS=your.domain.tld   # automatic HTTPS via Let's Encrypt
#                                   # (ports 80+443 must reach this host)
#   BETTER_AUTH_URL=https://your.domain.tld
#   BETTER_AUTH_TRUSTED_ORIGINS=https://your.domain.tld
# Without CADDY_ADDRESS it serves plain HTTP on :80 (e.g. behind another proxy).

services:
  proxy:
    image: caddy:2-alpine
    ports:
      - "80:80"
      - "443:443"
    environment:
      CADDY_ADDRESS: "${CADDY_ADDRESS:-:80}"
    volumes:
      - caddy_data:/data
      - caddy_config:/config
    configs:
      - source: caddyfile
        target: /etc/caddy/Caddyfile
    depends_on:
      - web
    restart: unless-stopped

configs:
  caddyfile:
    # Self-contained so a plain curl of the two compose files is a full install.
    # The site address comes from the CADDY_ADDRESS env var, expanded by Caddy
    # itself ($$ is the compose escape for a literal $).
    content: |
      {$$CADDY_ADDRESS::80} {
      	encode zstd gzip
      	reverse_proxy web:3000 {
      		flush_interval -1
      	}
      }

volumes:
  caddy_data:
  caddy_config:
